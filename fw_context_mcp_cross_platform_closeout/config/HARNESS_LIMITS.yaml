mode: DSH_SAFE
max_diagnostic_concurrency: 2
max_implementation_concurrency: 1
max_verification_concurrency: 1
max_delegation_depth: 1
child_may_spawn_subagents: false
max_child_return_chars: 5000
full_logs_must_be_files: true
on_server_error:
- stop new launches
- persist state/ledger
- set all concurrency to 1
- retry unfinished task only
- never restart completed tasks
